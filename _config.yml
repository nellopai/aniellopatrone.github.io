title: "Dr Aniello R. Patrone"
author: "Dr Aniello R. Patrone"
description: "Lead AI Scientist · Computer Vision & Deep Learning"
lang: "en"
url: "https://www.aniellopatrone.eu"
#baseurl: /aniellopatrone.github.io
# Layout
show_social: true          # show site description and social links in the footer
show_frame: false           # adds a gray frame to the site

# Menu
navigation:
  - {url: "/", title: "Home", icon: home}
  - {url: "/cv/", title: "Biography", icon: scroll}
  - {url: "/publications/", title: "Publications", icon: scroll}

navigation_de:
  - {url: "/de/", title: "Startseite"}
  - {url: "/de/cv/", title: "Werdegang"}
  - {url: "/de/publications/", title: "Publikationen"}

external:                  # see http://fontawesome.com/icons
  - {title: Mail, icon: envelope, url: "mailto:npatrone@protonmail.com"}
  - {title: LinkedIn, icon: linkedin, url: "https://www.linkedin.com/in/aniello-raffaele-patrone-71183127/"}
  - {title: Github, icon: github, url: "https://github.com/nellopai"}

plugins:
 - jekyll-seo-tag
 - jekyll-sitemap

# used by jekyll-seo-tag for structured data (schema.org Person)
social:
  type: Person
  name: "Aniello R. Patrone"
  links:
    - "https://github.com/nellopai"
    - "https://www.linkedin.com/in/aniello-raffaele-patrone-71183127/"
    - "https://scholar.google.at/citations?hl=en&user=TE0GJuMAAAAJ"

# default preview image for shared links (jekyll-seo-tag reads page.image, not site.image)
defaults:
  - scope: {path: ""}
    values:
      image: /assets/images/og-image.jpg

# repo files that are not part of the site
exclude:
  - README.md
  - UNLICENSE.txt
